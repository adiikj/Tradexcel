# Stock-name recognition data. The base list is the frontend's StockData.json
# (symbol, shortName, fullName); this file only adds what people actually type.
#
# aliases:      extra surface forms that map to exactly one symbol.
# ambiguous:    a word shared by several listed companies. `default` is used
#               when the question gives no other hint (and the reply says so);
#               without one the assistant asks which company was meant.
# common_words: symbols/names that are also everyday words. They only count as
#               a stock when written in caps or next to a cue like "price",
#               "share", "stock" or "buy".
