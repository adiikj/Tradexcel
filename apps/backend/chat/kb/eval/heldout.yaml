# Held-out test set. Never used for training or threshold tuning; written in a
# separate pass with deliberately different styles from the card questions:
#   terse       - keyword fragments      typo      - misspellings / no spaces
#   rambling    - long, with backstory   multi     - two asks, first one is the label
#   formal      - stiff, polite          slang     - casual / text-speak
#   adversarial - tries to get advice    plain     - ordinary phrasing, new wording
# expect: a card id, or intent:<id> for data-backed intents.
cases:
