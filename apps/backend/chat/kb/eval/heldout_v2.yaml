# Locked test set for the model-improvement round (written 2026-09-25, before
# any of that round's data, training or tuning changes). Only scored at the end;
# never used for tuning or error analysis while iterating - that's what the
# dev set (heldout.yaml) is for.
#
# Balanced so every intent has enough cases for a stable macro-F1. Same style
# tags as heldout.yaml.
