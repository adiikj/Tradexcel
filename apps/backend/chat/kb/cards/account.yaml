  - id: account.forgot_password
    category: account
    title: Forgot your password or PIN
    answer: |
      On the sign-in page, tap **Forgot password or PIN?** and enter your email. We'll send you a **6-digit code** that's valid for 10 minutes. Enter it with your new password or PIN and you're done. For safety, this signs you out on your other devices.
      No email? Check your spam folder. You can resend the code once a minute. If you signed up with Google, you can just use **Sign in with Google**.
    questions:
      - i forgot my password
      - forgot pin what do i do
      - how do i reset my password
      - i can't log in
