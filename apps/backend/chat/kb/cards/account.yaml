  - id: account.session_expired
    category: account
    title: '"Your session has expired" and staying signed in'
    answer: |
      You stay signed in on a device until your session runs out. You're also signed out when you **sign in on another device**, because only your latest sign-in is kept active.
      When you see *"Your session has expired"*, just sign in again. Your portfolio is exactly as you left it.
    questions:
      - why was i logged out
      - it says your session has expired
      - i keep getting signed out
      - can i stay logged in on two devices
      - logged in on my phone and got kicked out on laptop
      - how long does a login last
      - why do i have to sign in again
      - session timeout
    tags: [session, logout, devices]
    links:
