  - id: account.signup
    category: account
    title: Creating an account
    answer: |
      Tap **Create a free account** and enter your name, a username, your email, a password (8+ characters) and a 4-digit PIN. We'll email you a 6-digit code, and once you enter it your wallet is ready with {{STARTING_BALANCE}}.
      Or use **Sign in with Google** and skip the password.
