  - id: account.google
    category: account
    title: Signing in with Google
    answer: |
      **Sign in with Google** works for new and existing players:
      - If you already have an account with the same email, Google is simply linked to it.
      - New players verify a one-time code we email them, then get a username based on their email and their Google photo as their avatar. You can change both in **Your Profile**.
