    related: [account.sign_in_options]
    sources:
      - apps/backend/src/controllers/user.controller.ts
      - apps/backend/src/middlewares/auth.middleware.ts

  - id: account.sign_out
    category: account
    title: Signing out
    answer: |
      Open the profile menu in the header (your photo) and choose **Log out**. If you're on a shared computer, always log out when you're done.
