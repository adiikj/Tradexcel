  - id: account.otp
    category: account
    title: Email verification code (OTP)
    answer: |
      When you sign up, we email you a **6-digit code**. It's valid for **10 minutes**. Your wallet is created as soon as you verify.
      If it expired or never arrived, check your spam folder, then **sign up again with the same details** to get a new code.
