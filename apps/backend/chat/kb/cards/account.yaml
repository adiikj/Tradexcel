cards:
  - id: account.sign_in_options
    category: account
    title: Ways to sign in (password, PIN, Google)
    answer: |
      You can sign in with your **email or username** plus either:
      - your **4-digit PIN** (the default on the sign-in page), or
      - your **password**. Tap *Use password instead* to switch.

      You can also use **Sign in with Google**. Google accounts can add a password or PIN later from your profile.
    questions:
      - how do i sign in
      - what is the pin for
      - can i log in with my username
      - can i use a pin instead of a password
      - how do i log in with google
      - what's the 4 digit pin
      - login options?
      - i signed up with google, can i set a password
      - do i need both password and pin
    tags: [login, sign in, pin, google]
    links:
      - { label: Your profile, href: /your-profile }
    related: [account.change_password_pin, account.forgot_password]
    hard_negatives: [account.change_password_pin]
    sources:
      - apps/backend/src/controllers/user.controller.ts
      - apps/frontend/src/components/auth/SignIn.tsx

  - id: account.change_password_pin
    category: account
    title: Changing your password or PIN
    answer: |
      Go to **Your Profile** and use **Change password** or **Change PIN**. You'll need your current one to confirm.
      If you signed up with Google and never set one, the same section says **Set a password** / **Set a PIN** and doesn't ask for an old one.
