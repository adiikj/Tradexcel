  - id: edu.mutual_fund
    category: education
    title: Mutual funds and SIPs
    answer: |
      A **mutual fund** pools money from many investors, and a professional manager invests it in stocks, bonds or both. A **SIP** (systematic investment plan) invests a fixed amount in a fund every month.
      Funds trade at a daily **NAV** (net asset value), not live like stocks.
