  - id: edu.short_selling_concept
    category: education
    title: What short selling is
    answer: |
      **Short selling** means selling shares you've borrowed, hoping to buy them back cheaper later and pocket the difference. It profits when prices fall, but losses can be large if the price rises instead.
      In India, retail short selling is mostly intraday. TradeXcel doesn't support it.
    questions:
      - what is short selling
      - how does shorting work
      - what does going short mean
