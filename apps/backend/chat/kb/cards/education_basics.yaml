      - what is an all time high
      - how far is it from its yearly high
      - 52w range meaning
      - near 52 week low meaning
      - what is a breakout
    tags: [52 week, range]
    related: [edu.support_resistance]

  - id: edu.penny_stocks
    category: education
    title: Penny stocks
    answer: |
      **Penny stocks** trade at very low prices, often under ₹10–20, usually from small companies. They're cheap per share but tend to be **illiquid, volatile and easy to manipulate**, and many "tips" target them.
      A low share price doesn't mean a stock is cheap in value.
