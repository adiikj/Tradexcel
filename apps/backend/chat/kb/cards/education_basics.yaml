  - id: edu.index_fund_etf
    category: education
    title: Index funds and ETFs
    answer: |
      An **index fund** copies an index like the Nifty 50, so you own a slice of all its companies at once. An **ETF** does the same but trades on the exchange like a stock.
      Both are popular low-cost ways to get broad diversification. TradeXcel only has individual stocks.
