  - id: edu.options_basics
    category: education
    title: Futures and options (F&O)
    answer: |
      **Options** give the right, but not the obligation, to buy (**call**) or sell (**put**) at a set price before a date. **Futures** are an obligation to buy or sell at a set price on a future date.
      Both use leverage, so gains and losses are magnified. SEBI studies have found that most retail F&O traders lose money. TradeXcel doesn't offer F&O.
    questions:
      - what are options
      - what is a call option
      - what is a put option
      - what are futures
