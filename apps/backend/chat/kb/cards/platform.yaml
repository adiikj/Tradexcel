  - id: wallet.starting_balance
    category: platform
    title: How much virtual money you start with
    answer: |
      Every player gets **{{STARTING_BALANCE}}** in virtual cash at the start of each weekly season.
      It's play money, so you can't add more or withdraw it. Your **Wallet** page shows what's left and when the next reset happens.
