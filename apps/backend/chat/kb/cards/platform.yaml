  - id: trade.queued_orders
    category: platform
    title: Checking or cancelling a queued order
    answer: |
      Orders you place while the market is closed show under **Queued orders** on your Portfolio page, and you can **cancel** any of them until the market opens.
      At the open, each order is placed at the live price. If you no longer have enough cash or shares by then, it isn't placed. Either way you get a notification.
      When you queue a buy, your other queued buys count against your cash at the last price you saw.
