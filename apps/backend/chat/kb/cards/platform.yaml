  - id: trade.market_closed
    category: platform
    title: Trading hours and trading when the market is closed
    answer: |
      Prices follow NSE hours: **{{MARKET_HOURS}}**. Outside those hours prices stay at the last trading day's close, and a banner shows when the market opens next.
      You can still place orders while the market is closed. They're **queued** and placed automatically at the opening price.
      Orders queued between Friday's close and Monday's open run in the new season. Buys use your fresh {{STARTING_BALANCE}}, and sells can't be queued because the weekly reset sells every holding.
