  - id: contest.replay
    category: platform
    title: Replay contests that use past prices
    answer: |
      Some contests, marked **Replay**, re-run real past trading days instead of today's market. Each day of the contest matches one historical trading day, so everyone trades the same market at the same pace.
      That's why prices in a replay contest don't match what you see on the Market page.
