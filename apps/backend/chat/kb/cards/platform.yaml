  - id: trade.insufficient_funds
    category: platform
    title: '"Insufficient funds" or "Insufficient holdings" errors'
    answer: |
      - **Insufficient funds**: the order costs more than your cash. Buy fewer shares or sell something first. The cost is price × quantity.
      - **Insufficient holdings**: you're trying to sell more shares than you own. Your **Portfolio** shows the exact quantity you hold.
