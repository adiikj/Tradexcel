  - id: contest.private_league
    category: platform
    title: Creating or joining a private league
    answer: |
      **Create:** on the Contests page choose **Create a private league**, then set a name, start and end time, and up to 50 stocks. Starting cash and a prize are optional. You join it automatically and get an **invite code** to share.
      **Join:** choose **Join a private league** and enter the code a friend sent you. You can't join a league that has already ended.
