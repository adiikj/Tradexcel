  - id: trade.how_to_buy
    category: platform
    title: How to buy a stock
    answer: |
      1. Search for the stock by name or symbol on the **Market** page (or with the search on your Dashboard).
      2. Open it and choose **Buy**.
      3. Enter how many shares you want.

      During market hours the order fills straight away at the current price, and the cost comes out of your wallet. You need enough cash for price × quantity.
      If the market is closed, the order is queued and placed at the opening price.
