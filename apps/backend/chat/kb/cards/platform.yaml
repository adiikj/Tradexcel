  - id: trade.how_to_sell
    category: platform
    title: How to sell a stock
    answer: |
      Open the stock from your **Portfolio** or the **Market** page, choose **Sell**, and enter how many shares to sell.
      You can sell part of a holding or all of it. During market hours the sale fills at the current price and the money goes straight back into your wallet. Outside market hours it's queued for the open.
