  - id: contest.how_it_works
    category: platform
    title: How contests work
    answer: |
      Contests are separate competitions with a fixed start and end time. When you join one, you get a **separate contest wallet** with its own starting cash, so it never touches your weekly wallet.
      You can only trade the stocks listed for that contest, and live contests only trade while the market is open. Contest orders aren't queued. When it ends, players are ranked by net worth, and the winner shows up in the Hall of Fame.
