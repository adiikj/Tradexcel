  - id: season.weekly_reset
    category: platform
    title: What happens every Monday (weekly reset)
    answer: |
      TradeXcel runs in **weekly seasons**. Every Monday at 00:00 UTC (5:30 AM IST):
      1. Your net worth for the week is recorded in your history.
      2. All your holdings are sold at their latest price.
      3. Your wallet resets to **{{STARTING_BALANCE}}** for the new season.

      Contest wallets aren't touched, only your main one.
