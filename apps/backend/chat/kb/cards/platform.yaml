  - id: leaderboard.ranking
    category: platform
    title: How the leaderboard is ranked
    answer: |
      Players are ranked by **net worth**: your cash plus the current market value of everything you hold.
      The Leaderboard has four tabs: **Global**, **Following** (only people you follow), **Contest champions** and **Weekly champions**.
