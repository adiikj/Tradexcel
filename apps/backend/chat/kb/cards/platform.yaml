  - id: alerts.create
    category: platform
    title: Setting a price alert
    answer: |
      On the **Alerts** page, enter the stock symbol, pick **Goes above** or **Goes below**, and set a target price.
      Alerts are checked every couple of minutes while the market is open. When the stock crosses your target, you get an **email** and the alert moves to *triggered*. Each alert fires once.
