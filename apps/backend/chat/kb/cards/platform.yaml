  - id: trade.fees
    category: platform
    title: Brokerage, fees and taxes
    answer: |
      There are **no brokerage fees, taxes or charges** on TradeXcel. A trade costs exactly price × quantity, and a sale pays you exactly price × quantity.
      Real brokers charge fees, so real-world returns on the same trades would be a little lower.
