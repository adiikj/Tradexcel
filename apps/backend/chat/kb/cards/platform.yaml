  - id: achievements.streaks
    category: platform
    title: Login streaks
    answer: |
      Your streak goes up by one for each day in a row you **sign in** (days are counted in UTC). If you miss a day, it starts again at 1.
      Streaks earn {{BADGE:streak_3}}, {{BADGE:streak_7}} and {{BADGE:streak_30}}.
      Staying signed in doesn't count. It has to be an actual sign-in.
