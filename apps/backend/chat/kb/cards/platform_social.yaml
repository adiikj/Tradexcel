  - id: profile.avatar
    category: platform
    title: Changing your profile photo
    answer: |
      On **Your Profile**, choose a new photo and tap **Save photo**. JPEG, PNG, WebP and GIF images up to **5 MB** work.
      Until you upload one, you get a random avatar picked at sign-up.
