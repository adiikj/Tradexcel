  - id: leaderboard.hall_of_fame
    category: platform
    title: Hall of Fame and weekly champions
    answer: |
      The Leaderboard's **Contest champions** and **Weekly champions** tabs are the Hall of Fame. They list every contest winner, and the player with the **best return** each week.
      Winning a week (tied players all win) earns {{BADGE:weekly_champion}}.
