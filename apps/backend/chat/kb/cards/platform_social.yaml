  - id: contest.standings
    category: platform
    title: Contest standings
    answer: |
      Open a contest to see its **standings**. Everyone is ranked by net worth inside that contest (contest cash plus the value of contest holdings), and it updates as prices move.
      Your contest portfolio and cash are on the same page.
