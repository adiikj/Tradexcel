  - id: contest.prize
    category: platform
    title: Contest prizes
    answer: |
      A contest's **prize** is just a label set by whoever created it, like "Bragging rights" or a treat promised between friends. TradeXcel doesn't pay out money or rewards itself.
      Every contest winner does get the Contest Champion badge and a spot in the Hall of Fame.
