      - how do i follow someone
      - how to unfollow a trader
      - who am i following
      - how do i see my followers
      - can i follow my friends
      - why can't i follow myself
      - what happens when i follow a player
      - add a friend
      - how to connect with other players
    tags: [follow, friends, social]
    links:
