cards:
  - id: social.follow
    category: platform
    title: Following other traders
    answer: |
      Open a player's profile (from the leaderboard or search) and tap **Follow**. Their trades and contest results then show up on your **Activity** page, and they appear on the leaderboard's **Following** tab.
      They get a notification when you follow them. You can unfollow the same way, and your own profile lists your followers and who you follow.
