      - apps/frontend/src/components/social/FollowButton.tsx

  - id: social.activity
    category: platform
    title: The Activity feed
    answer: |
      **Activity** shows recent trades and contest results from the traders **you follow**. Filter to All, Trades or Contests.
      It's empty until you follow someone. Find players on the leaderboard or with search.
