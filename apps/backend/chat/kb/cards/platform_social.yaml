  - id: contest.private_manage
    category: platform
    title: Changing a private league after creating it
    answer: |
      Once a private league is created, its name, dates, stocks and starting cash **can't be changed**, so double-check before you create it. If you need different settings, create a new league and share its new invite code.
      Your league's invite code is on its contest page, where you can copy it anytime.
