  - id: contest.end
    category: platform
    title: When a contest ends
    answer: |
      Within about a minute of the end time, the final standings are **frozen**: each player's final rank and net worth are saved. Trading in that contest stops.
      The winner earns {{BADGE:contest_champion}}, the top 3 earn {{BADGE:podium_finish}}, and winners show up in the Hall of Fame. Contest cash and holdings stay in the contest and never move to your main wallet.
    questions:
      - what happens when a contest is over
      - do i keep my contest winnings
      - when are contest results final
      - does contest money go to my wallet
      - contest finished what now
      - how do i get the contest champion badge
      - are final contest ranks saved
      - does my contest portfolio carry over
    tags: [contest, end, results]
    links:
