  - id: contest.join_timing
    category: platform
    title: When you can join and trade in a contest
    answer: |
      You can join a contest any time **before it ends**, even after it's started. You'll still get the full starting cash, just less time to use it.
      Trading opens only while the contest is **live**. Before it starts you'll see *"This contest hasn't started yet"*, and after it ends trading is closed.
