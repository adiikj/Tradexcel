  - id: market.live_prices
    category: platform
    title: Where prices come from
    answer: |
      Prices are **real NSE market prices** and update live while the market is open. Look for the **live** badge.
      They come from a public market-data feed, so they can occasionally lag the exchange by a few seconds. When the market is closed you'll see the last closing price.
