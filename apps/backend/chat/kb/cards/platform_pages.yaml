  - id: market.page
    category: platform
    title: Using the Market page
    answer: |
      The **Market** page lists every stock you can trade. Search by name or symbol, open a stock to see its chart (1D, 5D, 1M, 6M, 1Y or 5Y), and buy or sell from there.
      The **heatmap** colours each stock by today's % change, from red to green, so you can see what's moving at a glance.
