  - id: alerts.manage
    category: platform
    title: Managing your price alerts
    answer: |
      On the **Alerts** page you can see your **active** alerts and the ones that have already **triggered**, and delete any you don't need.
      A triggered alert doesn't fire again. To keep watching the same price, create a new one.
