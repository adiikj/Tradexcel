  - id: notifications.bell
    category: platform
    title: Notifications
    answer: |
      The **bell** in the header collects your notifications: new followers, badges earned, price alerts that triggered, and queued orders that were placed or couldn't be. You can mark them all as read in one go.
      Price alerts are also emailed to you.
