  - id: market.which_stocks
    category: platform
    title: Which stocks you can trade
    answer: |
      You can trade the **250+ NSE-listed stocks** on the Market page. They cover banks, IT, pharma, autos, energy, FMCG, metals and more.
      If a stock isn't there, it can't be traded yet. Indices like the Nifty 50 or Sensex aren't stocks, so they can't be bought either.
