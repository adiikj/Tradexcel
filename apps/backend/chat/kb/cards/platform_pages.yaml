  - id: support.contact
    category: platform
    title: Contacting support
    answer: |
      Found a bug or stuck on something? Open the **Support** page, pick a topic (account, trading, contest, or something else), describe what happened, and send. For a trade problem, include the stock and roughly when it happened.
      Locked out of your account? Use the public **Contact us** page instead.
