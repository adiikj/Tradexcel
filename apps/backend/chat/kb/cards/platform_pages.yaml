  - id: portfolio.page
    category: platform
    title: What the Portfolio page shows
    answer: |
      **Portfolio** is your full picture:
      - net worth and this season's return
      - today's change, total return and cash
      - a **holdings** table with each stock's quantity, average price, current price and P&L
      - an **allocation** chart of where your money sits
      - your **weekly results** and recent trades

      Any orders queued while the market is closed also show here.
