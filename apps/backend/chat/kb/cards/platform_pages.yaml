# What each page is for and where things live. Kept to what the UI actually
# shows - see the listed components before changing an answer.
cards:
  - id: about.what_is_tradexcel
    category: platform
    title: What TradeXcel is
    answer: |
      TradeXcel is a **stock-trading game**. You trade real NSE stocks at real market prices, but with virtual money, so you can learn and practise without risking anything.
      Every week is a fresh season with {{STARTING_BALANCE}}, and you can compete on the leaderboard, in contests, and in private leagues with friends.
    questions:
      - what is tradexcel
      - what is this app
      - how does this game work
      - explain tradexcel to me
      - is this a real trading platform
      - what's the point of this site
      - is tradexcel a stock market simulator
      - what can i do on tradexcel
      - how do i get started
      - i'm new here, where do i begin
    tags: [about, intro, getting started]
    links:
      - { label: How it works, href: /how-it-works }
    related: [wallet.starting_balance, season.weekly_reset, trade.how_to_buy]
    hard_negatives: [smalltalk.capabilities]
    sources:
      - apps/frontend/src/components/faq/Faq.tsx
      - apps/backend/src/services/weeklyReset.ts

  - id: dashboard.overview
    category: platform
    title: What the Dashboard shows
    answer: |
      Your **Dashboard** is the home screen after you sign in. It shows:
      - your **net worth**, holdings and open P&L
      - **Today's market**: the day's biggest gainers and losers
      - a leaderboard snapshot
      - a search box for trading any stock without leaving the page

      Tap **Take the tour** in the header anytime for a walkthrough.
