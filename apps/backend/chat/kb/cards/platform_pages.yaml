  - id: trade.fill_price
    category: platform
    title: What price your order gets
    answer: |
      A market-hours order fills at the **live price when the server processes it**. The price in the trade window refreshes every few seconds, so the final price can differ slightly from what you saw.
      Queued orders fill at the first live price after the market opens. Check the exact price of any trade in your Wallet's transaction list.
