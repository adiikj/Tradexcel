  - id: trade.quantity_rules
    category: platform
    title: How many shares you can buy
    answer: |
      Orders are in **whole shares**, at least 1. There's no upper limit other than your cash: you can buy as many as price × quantity lets you afford.
      Fractional shares aren't supported, so some expensive stocks need a big chunk of your balance for even one share.
