  - id: edu.learning_path
    category: education
    title: How to start learning about the market
    answer: |
      A simple path:
      1. Learn the basics: shares, indices, P&L and market cap.
      2. Make small trades here and watch how prices react to news.
      3. Try reading one company's quarterly results.
      4. Learn about risk: diversification and position sizing.

      Ask me about any term along the way.
