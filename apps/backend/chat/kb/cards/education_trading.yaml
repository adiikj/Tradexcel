    tags: [intraday, delivery, swing]
    related: [edu.buy_and_hold, season.weekly_reset]

  - id: edu.buy_and_hold
    category: education
    title: Buy-and-hold vs active trading
    answer: |
      **Buy-and-hold** investors own good businesses for years and ride out the ups and downs. **Active traders** try to profit from shorter moves, which takes more time and involves more trades.
      Tradexcel's weekly seasons suit shorter-term play, so treat it as practice, not a model of long-term investing.
