      - how to control emotions while trading
      - why do i panic sell
      - what is revenge trading
      - trading psychology tips
      - greed and fear in the market
      - why do i always buy the top
      - how to stay calm when stocks fall
    tags: [psychology, fomo, emotions]
    related: [edu.risk_reward, edu.overtrading]

  - id: edu.overtrading
    category: education
    title: Overtrading
    answer: |
      **Overtrading** is trading too often, usually out of boredom, excitement or chasing losses. In real markets every trade costs brokerage and taxes, and frequent in-and-out trading often underperforms simply holding.
      Tradexcel has no fees, so overtrading doesn't cost money here, but it's still worth noticing the habit.
