      - 1:2 risk reward meaning
      - book profit or hold
    tags: [risk reward, exits]
    related: [edu.position_sizing, edu.emotions]

  - id: edu.intraday_delivery
    category: education
    title: Intraday vs delivery trading
    answer: |
      **Intraday** trading means buying and selling on the same day. **Delivery** means holding the shares overnight or longer. Brokers treat the two differently in margin and charges.
      Tradexcel has no such distinction: you hold shares until you sell them or the weekly reset sells them.
