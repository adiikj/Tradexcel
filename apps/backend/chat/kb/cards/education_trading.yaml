      - what is risk tolerance
      - is it possible to earn without risk
      - what is risk in stock market
      - measure my risk
    tags: [risk, return]
    related: [edu.volatility, edu.diversification]

  - id: edu.position_sizing
    category: education
    title: Position sizing
    answer: |
      **Position sizing** is deciding how much money to put into one trade. A common rule of thumb is to never let a single position be big enough to wreck your portfolio if it goes badly.
      On Tradexcel, try the same idea with different sizes and watch how much one stock can swing your net worth.
