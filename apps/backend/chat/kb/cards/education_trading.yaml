cards:
  - id: edu.technical_analysis
    category: education
    title: Technical analysis
    answer: |
      **Technical analysis** studies price charts and volume, looking for trends and patterns such as support and resistance, moving averages and momentum indicators.
      It focuses on *how* the price is moving rather than on the business. Nothing in it is certain, and signals often fail.
    questions:
      - what is technical analysis
      - how do i read a stock chart
      - do chart patterns work
      - what are technical indicators
      - how do traders use charts
      - what is price action
      - chart reading for beginners
      - is technical analysis reliable
    tags: [technical analysis, charts]
    links:
