    tags: [support, resistance]
    related: [edu.52_week, edu.technical_analysis]

  - id: edu.rsi
    category: education
    title: RSI (Relative Strength Index)
    answer: |
      **RSI** is a momentum indicator from 0 to 100 that compares recent gains with recent losses. By convention, above 70 is called "overbought" and below 30 "oversold".
      Strong trends can stay overbought or oversold for a long time, so RSI alone isn't a buy or sell signal.
