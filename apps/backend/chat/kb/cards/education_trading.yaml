  - id: edu.emotions
    category: education
    title: Trading psychology
    answer: |
      Common emotional traps:
      - **FOMO**: buying because something already shot up
      - **panic selling** after a sharp drop
      - **revenge trading** to win back a loss
      - holding losers too long while selling winners too early

      Having a plan before each trade helps. Practising here, where losses are virtual, is a good way to notice your own habits.
    questions:
