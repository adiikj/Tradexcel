    related: [edu.candlestick, edu.moving_average]
    hard_negatives: [edu.fundamental_analysis]

  - id: edu.candlestick
    category: education
    title: Candlestick charts
    answer: |
      Each **candle** shows one period's open, high, low and close. The thick body spans open to close, and the thin wicks reach the high and low.
      A green (up) candle closed higher than it opened, and a red (down) candle closed lower.
