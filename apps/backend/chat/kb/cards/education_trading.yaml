  - id: edu.drawdown
    category: education
    title: Drawdown
    answer: |
      A **drawdown** is how far your portfolio (or a stock) has fallen from its peak. A drop from ₹1,20,000 to ₹90,000 is a 25% drawdown.
      Recovering takes a bigger gain than the loss: after a 25% fall, you need about +33% to get back to where you were.
