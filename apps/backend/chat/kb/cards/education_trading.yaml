      - momentum indicators explained
      - rsi divergence meaning
    tags: [rsi, momentum, indicator]
    related: [edu.technical_analysis]

  - id: edu.trend
    category: education
    title: Trends
    answer: |
      An **uptrend** is a series of higher highs and higher lows, and a **downtrend** is lower highs and lower lows. "The trend is your friend" is a common saying, but trends always end eventually.
      Looking at a longer chart range (like 6M or 1Y on the Market page) makes trends easier to see.
    questions:
