  - id: edu.game_strategy
    category: education
    title: Getting better at Tradexcel
    answer: |
      There's no guaranteed way to win, but principles that help:
      - spread your cash across a few stocks and sectors
      - size positions so one bad pick can't sink your week
      - read the news for stocks you hold
      - decide your exit before you buy
      - review your weekly results to see what worked

      Contests reward the same habits.
