    related: [edu.technical_analysis]

  - id: edu.moving_average
    category: education
    title: Moving averages
    answer: |
      A **moving average** is the average closing price over the last N days, like the 50-day or 200-day. It smooths out noise to show the trend.
      A price above a rising moving average is often read as an uptrend. The 50-day crossing above the 200-day is called a **golden cross**, and crossing below is a **death cross**.
