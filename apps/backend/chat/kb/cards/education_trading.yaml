  - id: edu.rebalancing
    category: education
    title: Rebalancing
    answer: |
      **Rebalancing** means bringing your portfolio back to your intended mix. For example, if one stock grew to half your portfolio, you'd trim it and spread the money around again. It keeps risk from quietly concentrating.
      The **Allocation** chart on your Portfolio page shows your current mix.
