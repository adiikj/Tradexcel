      - 50 day moving average meaning
      - how to use moving averages
      - stock below 200 day average meaning
    tags: [moving average, trend]
    related: [edu.trend, edu.technical_analysis]

  - id: edu.support_resistance
    category: education
    title: Support and resistance
    answer: |
      **Support** is a price level where a falling stock has repeatedly stopped falling, because buyers stepped in. **Resistance** is a level where a rising stock has repeatedly stalled.
      A clear break through either level is often watched as a signal, though false breakouts are common.
