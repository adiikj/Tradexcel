    hard_negatives: [edu.diversification]

  - id: edu.risk_reward
    category: education
    title: Risk-reward ratio and cutting losses
    answer: |
      The **risk-reward ratio** compares how much you could lose on a trade with how much you hope to gain. For example, risking ₹1 to potentially make ₹2 is 1:2.
      Many traders set an exit point before they buy, so one losing trade stays small instead of turning into a big loss.
    questions:
