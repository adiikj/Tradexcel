      - what is a downtrend
      - how to identify a trend
      - trend is your friend meaning
      - what is a sideways market
      - what is consolidation
      - what is a trend reversal
    tags: [trend]
    related: [edu.moving_average]

  - id: edu.risk_return
    category: education
    title: Risk and return
    answer: |
      Higher potential returns come with higher risk: bigger possible losses, bigger swings, or both. There's no reliably high return without risk, so be wary of anything promising one.
      On Tradexcel, risk is free to explore. Notice how volatile picks change your weekly results compared with steady ones.
    questions:
