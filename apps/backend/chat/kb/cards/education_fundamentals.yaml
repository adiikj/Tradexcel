  - id: edu.cagr
    category: education
    title: CAGR and annualised returns
    answer: |
      **CAGR** (compound annual growth rate) is the steady yearly rate that would turn a starting value into an ending value.
      CAGR = (end ÷ start)^(1 ÷ years) − 1. Example: ₹1,00,000 growing to ₹2,00,000 in 5 years is about 14.9% a year.
