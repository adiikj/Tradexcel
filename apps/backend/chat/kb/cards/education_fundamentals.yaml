  - id: edu.beta
    category: education
    title: Beta
    answer: |
      **Beta** measures how much a stock tends to move compared with the overall market. A beta of 1 moves with the market. Above 1 swings more, for example 1.5 moves about 1.5% when the market moves 1%. Below 1 swings less.
