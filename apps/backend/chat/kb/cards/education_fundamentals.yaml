      - annualised return meaning
      - absolute return vs cagr
      - what is xirr
      - average annual return explained
      - how much did it grow per year
      - cagr formula
    tags: [cagr, returns]
    related: [edu.compounding]

  - id: edu.compounding
    category: education
    title: Compounding
    answer: |
      **Compounding** is earning returns on your past returns, not just on the original amount. Over long periods it makes a huge difference: 12% a year roughly doubles money in 6 years and grows it about 10 times in 20.
      Time in the market matters as much as the rate.
