# Reading a company's numbers and the economy around it.
cards:
  - id: edu.fundamental_analysis
    category: education
    title: Fundamental analysis
    answer: |
      **Fundamental analysis** judges a company by its business: revenue and profit growth, debt, management, competition, and valuation ratios like P/E and P/B.
      The idea is to estimate what the business is worth and compare it with the share price.
    questions:
      - what is fundamental analysis
      - how do i analyse a company
      - how to know if a stock is undervalued
      - what makes a company good
      - how to research a stock
      - fundamental vs technical analysis
      - what is intrinsic value
      - where to start analysing companies
    tags: [fundamental analysis, research]
    related: [edu.pe_ratio, edu.technical_analysis]
    hard_negatives: [edu.technical_analysis]

  - id: edu.revenue_profit
    category: education
    title: Revenue, profit and margins
    answer: |
      - **Revenue** (sales) is the money a company brings in.
      - **Net profit** is what's left after all costs, interest and tax.
      - **Profit margin** is profit ÷ revenue.

      Growing revenue with steady or rising margins is usually a healthy sign. Growing sales with shrinking profit deserves a closer look.
    questions:
      - what is revenue
      - revenue vs profit
      - what is net profit
      - what is operating margin
      - what is ebitda
      - what does profit margin mean
      - top line vs bottom line
      - why does profit matter more than sales
    tags: [revenue, profit, margin]
    related: [edu.earnings_results]

  - id: edu.earnings_results
    category: education
    title: Quarterly results
    answer: |
      Listed companies report **results every quarter**. Prices often jump or drop on results day, depending on whether the numbers beat or missed what the market expected. The expectation matters as much as the result itself.
    questions:
      - what are quarterly results
      - why did the stock fall after good results
      - what is earnings season
      - what does beat estimates mean
      - when do companies announce results
      - what is q1 q2 q3 q4
      - results day volatility
      - what is guidance
    tags: [results, earnings]
    related: [edu.revenue_profit, edu.news_impact]

  - id: edu.pb_ratio
    category: education
    title: Book value and P/B ratio
    answer: |
      **Book value** is roughly what a company would be worth if it sold its assets and paid its debts. **P/B = share price ÷ book value per share.**
      P/B is widely used for banks and financial companies. A P/B below 1 means the market values the company below its book value.
    questions:
      - what is book value
      - what is p/b ratio
      - price to book explained
      - is low price to book good
      - why is p/b used for banks
      - book value per share meaning
      - p/b below 1 meaning
      - what is net worth of a company
    tags: [book value, pb, valuation]
    related: [edu.pe_ratio, edu.roe]

  - id: edu.roe
    category: education
    title: ROE and ROCE
    answer: |
      **ROE** (return on equity) = net profit ÷ shareholders' equity. It measures how well a company turns shareholders' money into profit.
      **ROCE** does the same using all capital, including debt. Consistently high ROE/ROCE is often a sign of a strong business, as long as it isn't driven by heavy debt.
    questions:
      - what is roe
      - what is roce
      - return on equity meaning
      - is high roe good
      - roe vs roce
      - how efficient is a company
      - what is return on capital
      - good roe percentage
    tags: [roe, roce, efficiency]
    related: [edu.debt_equity, edu.pb_ratio]

  - id: edu.debt_equity
    category: education
    title: Debt-to-equity
    answer: |
      **Debt-to-equity = total debt ÷ shareholders' equity.** It shows how much a company relies on borrowing.
      Some debt is normal, but high debt makes a company riskier when interest rates rise or business slows. Compare it with others in the same sector, since banks and utilities naturally carry more.
    questions:
      - what is debt to equity
      - is debt bad for a company
      - what is a debt free company
      - high debt stock risk
      - what is leverage of a company
      - how to check company debt
      - d/e ratio meaning
      - what is interest coverage
    tags: [debt, leverage]
    related: [edu.roe]

  - id: edu.dividend_yield
    category: education
    title: Dividend yield
    answer: |
      **Dividend yield = yearly dividend per share ÷ share price.** A ₹500 stock paying ₹15 a year yields 3%.
      A very high yield can be a warning sign: sometimes it's high because the price has fallen sharply.
