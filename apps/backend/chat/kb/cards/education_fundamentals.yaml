    hard_negatives: [edu.dividend]

  - id: edu.growth_value
    category: education
    title: Growth vs value investing
    answer: |
      **Growth investing** looks for companies growing fast, and often pays a high P/E for that growth. **Value investing** looks for companies trading below what they seem to be worth, often at a low P/E or P/B.
      Both are styles, not guarantees. Each goes through long periods in and out of favour.
    questions:
      - what is value investing
      - what is growth investing
      - growth vs value stocks
      - who is warren buffett
      - what is a value trap
      - what is margin of safety
      - quality stocks meaning
      - investing styles explained
    tags: [growth, value, investing style]
    related: [edu.pe_ratio, edu.pb_ratio]

  - id: edu.interest_rates
    category: education
    title: How interest rates affect stocks
    answer: |
      When the **RBI** raises interest rates, borrowing gets costlier and safe options like FDs pay more, which tends to weigh on stocks, especially high-debt and high-growth ones. Rate cuts usually do the opposite.
      Banks, real estate and autos are especially sensitive to rates.
    questions:
      - how do interest rates affect the stock market
      - what is repo rate
      - why did the market fall after rbi policy
      - what does rbi rate hike mean for stocks
      - rate cut effect on shares
      - which sectors are rate sensitive
      - what is monetary policy
      - bond yields and stocks
    tags: [interest rates, rbi, macro]
    related: [edu.inflation]

  - id: edu.inflation
    category: education
    title: Inflation and the market
    answer: |
      **Inflation** is the general rise in prices over time. Moderate inflation is normal, but high inflation squeezes company profits and pushes the central bank to raise interest rates, both of which can pull stock prices down.
      Over long periods, stocks have historically been one way people try to beat inflation.
    questions:
      - what is inflation
      - how does inflation affect stocks
      - what is cpi
      - why does high inflation hurt markets
      - is inflation good or bad
      - real return meaning
      - what is wpi
      - stocks as inflation hedge
    tags: [inflation, macro]
    related: [edu.interest_rates, edu.compounding]

  - id: edu.news_impact
    category: education
    title: Why news moves prices
    answer: |
      Prices react to anything that changes what a company might earn: results, orders, management changes, regulation, global markets, oil prices, government policy.
      Often the news is already "priced in" before it's announced, which is why a stock can fall on good news.
